          schema:
            type: string
        -
          name: address_type
          in: path
          description: 'IP protocol version filter'
          required: true
          schema:
            type: string
            enum:
              - IPv4
              - IPv6
              - v4
              - v6
              - '4'
              - '6'
        -
          name: mask
          in: path
          description: 'Requested subnet bitmask (8-128, IPv4 limited to <=32)'
