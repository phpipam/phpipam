components:
  schemas:
    ErrorResponse:
      properties:
        code:
          description: 'HTTP status code, repeated in the body'
          type: integer
          example: 400
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'Missing parameters'
      type: object
    SuccessResponse:
      properties:
        code:
          type: integer
          example: 200
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Subnet updated'
          nullable: true
        data:
          description: 'Payload, shape depends on the endpoint'
          nullable: true
      type: object
    Section:
      properties:
        id:
          type: integer
          example: 1
        name:
