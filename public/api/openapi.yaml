        '401':
          description: 'Invalid/missing token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Authentication not needed (ssl_code apps have no per-session token)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
